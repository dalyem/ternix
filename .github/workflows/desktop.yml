name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg, zip)
            os: macos-latest
            target: --mac
          - name: Windows (nsis)
            os: windows-latest
            target: --win
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Check the desktop app
        run: |
          pnpm --filter @ternix/desktop typecheck
          pnpm --filter @ternix/desktop test

      - name: Bundle the app
        run: pnpm --filter @ternix/desktop build

      # Signing and notarization run only when the secrets exist; without them the
      # installers are unsigned (macOS: no identity is searched for in the runner keychain).
      - name: Package installers
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --config electron-builder.config.mjs ${{ matrix.target }} --publish never

      # Read the fuses back from what was packaged: RunAsNode and the Node inspector must be off.
      - name: Check the packaged fuses
        working-directory: apps/desktop
        run: |
          shopt -s nullglob
          apps=(dist/mac*/Ternix.app dist/win*-unpacked/Ternix.exe)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "no packaged app found in dist/" >&2
            exit 1
          fi
          bash scripts/check-fuses.sh "${apps[@]}"

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ternix-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
