name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg, zip)
            os: macos-latest
            target: --mac
          - name: Windows (nsis)
            os: windows-latest
            target: --win
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      # --ignore-scripts: the desktop bundle has no native modules, and install scripts would
      # build the server's better-sqlite3, which needs a C++ toolchain (absent on Windows runners).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: pnpm run build:packages

      # The unit and integration tests run in Kiln (`kiln checks run test`); several start the
      # real server, whose SQLite binding is not built here.
      - name: Typecheck the desktop app
        run: pnpm --filter @ternix/desktop typecheck

      - name: Bundle the app
        run: pnpm --filter @ternix/desktop build

      # Signing and notarization run only when the secrets exist; without them the installers
      # are unsigned. Variables are exported only when non-empty: electron-builder treats an
      # empty CSC_LINK as a path and fails.
      - name: Package installers
        working-directory: apps/desktop
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_CSC_LINK" ]; then
            export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$SECRET_APPLE_ID" ]; then
            export APPLE_ID="$SECRET_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          fi
          if [ -n "$SECRET_WIN_CSC_LINK" ]; then
            export WIN_CSC_LINK="$SECRET_WIN_CSC_LINK" WIN_CSC_KEY_PASSWORD="$SECRET_WIN_CSC_KEY_PASSWORD"
          fi
          unset SECRET_CSC_LINK SECRET_CSC_KEY_PASSWORD SECRET_APPLE_ID SECRET_APPLE_APP_SPECIFIC_PASSWORD SECRET_APPLE_TEAM_ID SECRET_WIN_CSC_LINK SECRET_WIN_CSC_KEY_PASSWORD
          pnpm exec electron-builder --config electron-builder.config.mjs ${{ matrix.target }} --publish never

      # Read the fuses back from what was packaged: RunAsNode and the Node inspector must be off.
      - name: Check the packaged fuses
        working-directory: apps/desktop
        run: |
          shopt -s nullglob
          apps=(dist/mac*/Ternix.app dist/win*-unpacked/Ternix.exe)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "no packaged app found in dist/" >&2
            exit 1
          fi
          bash scripts/check-fuses.sh "${apps[@]}"

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ternix-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
