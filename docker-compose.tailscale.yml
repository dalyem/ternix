# Put the Ternix server on your tailnet instead of a host port.
#
#   TS_AUTHKEY=tskey-auth-... docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d --build
#
# A Tailscale sidecar joins your tailnet as machine `${TERNIX_TS_HOSTNAME:-ternix}` and
# serves https://<hostname>.<tailnet>.ts.net with a certificate from Tailscale. The
# ternix container shares the sidecar's network namespace and publishes no host port,
# so the server is reachable only from devices on your tailnet.
#
# Needs MagicDNS and HTTPS certificates enabled in the Tailscale admin console. The auth
# key is used once; the node identity then lives in the tailscale-state volume, so the
# key can be removed from the environment after the first start.

services:
  tailscale:
    image: tailscale/tailscale:v1.104.1
    hostname: ${TERNIX_TS_HOSTNAME:-ternix}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./apps/server/deploy/tailscale-serve.json:/config/serve.json:ro

  ternix:
    network_mode: service:tailscale
    depends_on:
      - tailscale
    # Tailscale serve is the only thing that can reach the server, and it sets
    # X-Forwarded-For to the tailnet client's address, which rate limiting needs.
    environment:
      TERNIX_TRUST_PROXY: 'true'
    ports: !reset []

volumes:
  tailscale-state:
